# ──────────────────────────────────────────────────────────────────────────────
# CloudERP docker-compose.yml — Production-like local testing
#
# Usage:
#   docker-compose up --build -d        # Start all services
#   docker-compose down -v              # Stop and remove volumes
#   docker-compose logs -f backend      # Tail backend logs
#
# Requires a .env file in the project root (copy from backend/.env.example)
# ──────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:

  # ── 1. MongoDB (local fallback — use Atlas URI in production) ─────────────
  mongodb:
    image: mongo:6-jammy
    container_name: clouderp-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - clouderp-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. FastAPI ML Service ──────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: clouderp-ml
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - clouderp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 3. Express Backend API ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clouderp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"            # Expose for direct API testing
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Use local MongoDB; override with Atlas URI for real prod
      - MONGO_URI=mongodb://mongodb:27017/clouderp
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - SOCKET_CORS_ORIGINS=${SOCKET_CORS_ORIGINS:-http://localhost}
      - ML_SERVICE_URL=http://ml-service:8000
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - clouderp-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 4. Nginx Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the backend URL so Vite embeds it at build time
        - VITE_API_URL=http://localhost:5000
    container_name: clouderp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clouderp-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  clouderp-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
