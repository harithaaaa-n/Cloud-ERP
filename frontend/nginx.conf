server {
    listen 80;
    server_name _;   # Matches any hostname — correct for Docker

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA Routing ─────────────────────────────────────────────────────────────
    # For any path that does not correspond to a physical file,
    # serve index.html so React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Aggressive Caching for Versioned Assets ──────────────────────────────────
    # Vite hashes JS/CSS filenames — safe to cache for 1 year
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security Headers ─────────────────────────────────────────────────────────
    add_header X-Frame-Options         "DENY"               always;
    add_header X-Content-Type-Options  "nosniff"            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml application/xml
                      application/xml+rss text/javascript image/svg+xml;

    # ── Error Pages ──────────────────────────────────────────────────────────────
    error_page 500 502 503 504 /index.html;
}
